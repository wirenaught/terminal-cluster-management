<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">Terminal organization without and with cluster</title>
  <desc id="desc">Left: ten unrelated terminal tabs in no order — two concurrent investigations (a payment wallet bug and a dockerize decision) with their tabs scrambled together and visually indistinguishable, plus a couple of ambient tabs. Right: the same tabs gathered into two named clusters, each with its own tabs, shared notes file, and command history.</desc>

  <!-- Headers -->
  <text x="200" y="32" text-anchor="middle" font-size="15" font-weight="500" fill="#7e8590">Without cluster</text>
  <text x="200" y="50" text-anchor="middle" font-size="12" fill="#7e8590">Two investigations in flight — which tabs go with which?</text>

  <text x="560" y="32" text-anchor="middle" font-size="15" font-weight="500" fill="#7e8590">With cluster</text>
  <text x="560" y="50" text-anchor="middle" font-size="12" fill="#7e8590">Tabs grouped, notes shared, history captured</text>

  <!-- ================================================================
       LEFT: 4×3 grid, 10 tabs + 2 empty slots. Tabs shuffled so no two
       same-cluster tabs are orthogonally adjacent.

       Inventory:
         payment-wallet-bug (W): claude, tail wallet.log, psql payments, vim repro.md
         dockerize-decision (D): aider, vim Dockerfile, docker build, nano notes.txt
         ambient (*): brew upgrade, git status

       Layout:
         Row 1: claude(W)       vim Dockerfile(D)  brew upgrade(*)   claude(D? no — aider)→ aider(D)
         Row 2: docker build(D) tail wallet.log(W) git status(*)     vim repro.md(W)
         Row 3: nano notes.txt(D) psql payments(W) [empty]           [empty]

       Adjacency check (H = horizontal neighbor, V = vertical neighbor):
         R1: W-D ok, D-* ok, *-D FAIL (brew→aider both not D... wait * is ambient, D is dockerize)
         Re-check R1 col3-col4: brew upgrade(*) — aider(D): * vs D, different, OK

         Vertical col1: W-D-D: docker build below nano notes.txt? Let me restate properly:
           col1 top→bot: claude(W), docker build(D), nano notes.txt(D) — D adjacent to D, FAIL.

       Reshuffle:
         Row 1: claude(W)         vim Dockerfile(D)  brew upgrade(*)  aider(D)
         Row 2: nano notes.txt(D) tail wallet.log(W) git status(*)    vim repro.md(W)
         Row 3: docker build(D)   psql payments(W)   [empty]          [empty]

       Vertical:
         col1: W-D-D — STILL FAIL (nano-docker both D)

       Reshuffle again:
         Row 1: claude(W)         vim Dockerfile(D)  brew upgrade(*)  aider(D)
         Row 2: docker build(D)   tail wallet.log(W) git status(*)    nano notes.txt(D)
         Row 3: psql payments(W)  vim repro.md(W)    [empty]          [empty]

       Vertical:
         col1: W-D-W ok
         col2: D-W-W FAIL

       Reshuffle:
         Row 1: claude(W)         vim Dockerfile(D)  brew upgrade(*)  aider(D)
         Row 2: docker build(D)   psql payments(W)   git status(*)    nano notes.txt(D)
         Row 3: vim repro.md(W)   tail wallet.log(W) [empty]          [empty]

       Vertical:
         col1: W-D-W ok
         col2: D-W-W FAIL still — repro.md(W) below psql(W)

       I need to put an ambient between the two wallet tabs in column 2.
       Try:
         Row 1: claude(W)         vim Dockerfile(D)  brew upgrade(*)  aider(D)
         Row 2: docker build(D)   psql payments(W)   git status(*)    nano notes.txt(D)
         Row 3: vim repro.md(W)   docker build(D)?   — but I only have one docker build

       Reframe: I have 10 tabs and 12 grid cells. 4W + 4D + 2* = 10. The
       two empty cells can be anywhere — they break adjacency too.
       Empty cells effectively act as ambient separators.

       Try with empties at (3,3) and (3,4):
         Row 1: claude(W)         vim Dockerfile(D)  brew upgrade(*)  aider(D)
         Row 2: docker build(D)   tail wallet.log(W) git status(*)    nano notes.txt(D)
         Row 3: vim repro.md(W)   psql payments(W)   [empty]          [empty]

       Horizontal adj:
         R1: W-D D-* *-D ok
         R2: D-W W-* *-D ok
         R3: W-W FAIL

       Try R3 swap:
         Row 3: psql payments(W)  vim repro.md(W)... same problem

       Put one of the wallets up, an ambient down:
         Row 1: claude(W)         vim Dockerfile(D)  brew upgrade(*)  aider(D)
         Row 2: docker build(D)   tail wallet.log(W) psql payments(W) nano notes.txt(D)
         Row 3: vim repro.md(W)   git status(*)      [empty]          [empty]

       R2: D-W-W-D FAIL (W-W adjacent)

       Need wallets non-adjacent. There are 4 wallet tabs that need to scatter
       across 10 occupied cells. With 4W in 10 cells, some adjacency is hard
       to avoid completely. Let me check the most-spread arrangement:

         (1,1)W (1,2)D (1,3)* (1,4)D
         (2,1)D (2,2)W (2,3)* (2,4)D
         (3,1)W (3,2)D (3,3)W (3,4)W   — but I only have 4 D, used 4 already

       4 W placed at (1,1),(2,2),(3,1),(3,3) — check adjacency:
         (1,1)-(2,1): W-D ok
         (1,1)-(1,2): W-D ok
         (2,2)-(1,2): W-D ok
         (2,2)-(3,2): W-D ok
         (2,2)-(2,1): W-D ok
         (2,2)-(2,3): W-* ok
         (3,1)-(2,1): W-D ok
         (3,1)-(3,2): W-D ok
         (3,3)-(3,2): W-D ok
         (3,3)-(2,3): W-* ok
         (3,3)-(3,4): W-? — what's at (3,4)?

       4 D placed at (1,2),(1,4),(2,1),(2,4),(3,2). That's 5 — only have 4.
       Let me use 4 D at (1,2),(1,4),(2,1),(3,2) and put ambient/empty elsewhere.

         (1,1)W (1,2)D (1,3)* (1,4)D
         (2,1)D (2,2)W (2,3)* (2,4)empty
         (3,1)W (3,2)D (3,3)W (3,4)W

       (3,3)-(3,4): W-W FAIL

       Move (3,4)W to (2,4):
         (1,1)W (1,2)D (1,3)* (1,4)D
         (2,1)D (2,2)W (2,3)* (2,4)W
         (3,1)W (3,2)D (3,3)W (3,4)empty

       (1,4)D-(2,4)W ok
       (2,4)W-(3,4)empty ok (empty counts as separator)
       (3,3)W-(3,4)empty ok
       (3,3)W-(2,3)* ok
       All other W positions: (1,1),(2,2),(3,1),(3,3),(2,4) — wait that's 5 W. I only have 4.

       Pull (3,3) → remove. New layout:
         (1,1)W (1,2)D (1,3)* (1,4)D
         (2,1)D (2,2)W (2,3)* (2,4)W
         (3,1)W (3,2)D (3,3)empty (3,4)empty

       Tabs: W at (1,1),(2,2),(2,4),(3,1) = 4 ✓
             D at (1,2),(1,4),(2,1),(3,2) = 4 ✓
             * at (1,3),(2,3) = 2 ✓
             empty at (3,3),(3,4) = 2 ✓
       Total = 12 ✓

       Adjacency check:
         (1,1)W: right (1,2)D ok; down (2,1)D ok
         (1,2)D: right (1,3)* ok; down (2,2)W ok; left (1,1)W ok
         (1,3)*: right (1,4)D ok; down (2,3)* — *-* ok (same type? both ambient — they're different commands; it's fine, ambient tabs don't form a "cluster")
         (1,4)D: down (2,4)W ok; left (1,3)* ok
         (2,1)D: right (2,2)W ok; down (3,1)W ok; up (1,1)W ok
         (2,2)W: right (2,3)* ok; down (3,2)D ok; left (2,1)D ok; up (1,2)D ok
         (2,3)*: right (2,4)W ok; down (3,3)empty ok; left (2,2)W ok; up (1,3)* (different ambient command — fine)
         (2,4)W: down (3,4)empty ok; left (2,3)* ok; up (1,4)D ok
         (3,1)W: right (3,2)D ok; up (2,1)D ok
         (3,2)D: right (3,3)empty ok; left (3,1)W ok; up (2,2)W ok
       PERFECT. Zero same-cluster adjacencies. Two empties at bottom-right
       are fine — they look like the grid just has gaps, which is realistic.

       Final tab assignment (commands chosen for variety within each cluster):
         (1,1) claude       (wallet)
         (1,2) vim Dockerfile (docker)
         (1,3) brew upgrade  (ambient)
         (1,4) aider         (docker)
         (2,1) docker build  (docker)
         (2,2) tail wallet.log (wallet)
         (2,3) git status    (ambient)
         (2,4) vim repro.md  (wallet)
         (3,1) psql payments (wallet)
         (3,2) nano notes.txt (docker)
         (3,3) [empty]
         (3,4) [empty]
       ================================================================ -->

