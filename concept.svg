  <rect x="120" y="158" width="92" height="34" rx="5" fill="#7e8590" fill-opacity="0.1" stroke="#7e8590" stroke-opacity="0.5" stroke-width="0.5"/>
  <text x="166" y="179" text-anchor="middle" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#7e8590">nano notes.txt</text>

  <!-- Cost annotations -->
  <text x="215" y="226" text-anchor="middle" font-size="12" fill="#7e8590">"which tabs are the wallet bug?"</text>
  <text x="215" y="244" text-anchor="middle" font-size="12" fill="#7e8590">"where's the dockerize discussion?"</text>
  <text x="215" y="262" text-anchor="middle" font-size="12" fill="#7e8590">"what was that opencode session id?"</text>
  <text x="215" y="280" text-anchor="middle" font-size="12" fill="#7e8590">"did claude run in this tab or that one?"</text>
  <text x="215" y="308" text-anchor="middle" font-size="12" fill="#7e8590">close iTerm2 and every context vanishes</text>

  <!-- ================================================================
       RIGHT: TWO clusters stacked. Each shows tabs, notes.txt as its
       own row, history.log as its own row (not collapsed).
       Cluster 1 includes a tiny example line under history showing the
       resume command — concretizes "why history matters."
       ================================================================ -->

